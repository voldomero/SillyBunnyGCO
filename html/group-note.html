<div id="group_note_div">
    <h4>
        <label for="group_note_pole" title="This note is shared in group context at the depth configured in Group Utils settings.">Group Note</label>
    </h4>
    <textarea id="group_note_pole" name="group_note" data-i18n="[placeholder](Note to be shared in a group chat, {{char}} will be replaced with this character)" placeholder="(Note to be shared in a group chat, {{char}} will be replaced with this character)" class="text_pole" maxlength="50000" autocomplete="off" rows="4"></textarea>
    <p class="sbu-legacy-note-warning" hidden>A legacy note uses this shared name. You can write a note for this card, or use Group Members to assign the legacy note explicitly.</p>
    <div class="extension_token_counter">
        <span data-i18n="extension_token_counter">Tokens:</span> <span data-token-counter="group_note_pole" data-token-permanent="true">0</span>
    </div>
</div>
